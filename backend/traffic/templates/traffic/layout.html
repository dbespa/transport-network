{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}База данных{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/854/854929.png">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .container {
            margin-top: 20px;
            margin-bottom: 40px;
        }
        .card {
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .btn-sm {
            margin-right: 5px;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 15px;
            background-color: #e9ecef;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}"><img src="{% static 'traffic/icons/map-svgrepo-com.svg' %}" alt="Map Icon" width="35" height="35">База данных транспортного графа</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'locations' %}"><img src="{% static 'traffic/icons/flag-triagle-svgrepo-com.svg' %}" alt="Flag Icon" width="24" height="24"> Точки</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'roads' %}"><img src="{% static 'traffic/icons/road-svgrepo-com.svg' %}" alt="Road Icon" width="24" height="24"> Дороги</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'traffic' %}"><img src="{% static 'traffic/icons/traffic-lights-traffic-light-svgrepo-com.svg' %}" alt="Traffic lights Icon" width="24" height="24"> Загруженность</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'contypes' %}"><img src="{% static 'traffic/icons/gear-cogwheel-svgrepo-com.svg' %}" alt="Gear wheel Icon" width="24" height="24"> Типы</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        Курсовая работа.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
